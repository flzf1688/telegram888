inbox:()=>title('客服收件箱','所有客户回复集中处理，不用逐个切换 Telegram 账号。',`<span class="tag orange">3 位客户等待人工</span>`)+`<div class="inbox"><div class="conversations"><div class="conv-head"><strong>最近会话</strong><p style="font-size:11px">需要人工的会话优先展示</p></div>${['Daniel Weber','Amelia Brown','Sofia Miller','Olivia Wilson'].map((n,i)=>`<div class="conversation ${selectedChat===i?'active':''}" onclick="selectedChat=${i};human=false;render()"><div class="row spread"><strong>${n}</strong><small>09:${42-i*4}</small></div><p>${['Can you share the wholesale price?','Do you ship to the UK?','Thanks for the catalog.','I have contacted your colleague.'][i]}</p><div style="margin-top:9px">${badge(i===0?'需要人工':i===1?'Agent 接待中':i===2?'等待回复':'已转交客服')}</div></div>`).join('')}</div><div class="chat"><div class="chat-head row spread"><div><strong>${['Daniel Weber','Amelia Brown','Sofia Miller','Olivia Wilson'][selectedChat]}</strong><p style="font-size:11px">经由 ${['Emma · 德国','Oliver · 英国','Alice · 美国','Alice · 美国'][selectedChat]}接待　<span class="switch">● 演示会话</span></p></div><button onclick="human=!human;render();toast(human?'已模拟人工接管，Agent 暂停回复':'已模拟交还 Agent')">${human?'交还 Agent':'人工接管'}</button></div><div class="messages" id="messages"><p style="text-align:center;font-size:10px;margin-bottom:24px">今天 · 以下为演示消息</p><div class="bubble me">Hello! Here is the product catalog you requested. Let me know which collection interests you.<small>Agent · 09:35 · 演示已发送</small></div><div class="bubble">${['Thanks! Can you share the wholesale price for 200 units?','Do you ship to the UK?','Thanks for the catalog.','I have contacted your colleague.'][selectedChat]}<small>客户 · 09:42</small></div><div class="agent-box">✧ ${human?'你已接管本次会话。Agent 将保持暂停，避免重复回复。':'客户询问批量报价，建议由人工确认价格。Agent 已暂停回复。'}</div></div><div class="compose"><textarea id="reply" aria-label="回复内容" placeholder="输入回复，体验模拟发送…"></textarea><div class="row spread"><button class="link" onclick="document.getElementById('reply').value='Thank you! Our sales specialist will confirm the quotation with you.'">＋ 快捷回复</button><button class="primary" onclick="send()">模拟发送 ↑</button></div></div></div><div class="customer-info"><div class="avatar" style="width:55px;height:55px;font-size:20px;margin-bottom:15px">${['D','A','S','O'][selectedChat]}</div><h3>客户资料</h3><div class="detail">公司<strong>${['Nord Living','Oak & Co.','Miller Home','Urban Nest'][selectedChat]}</strong></div><div class="detail">客户分组<strong>${selectedChat===0?'欧洲经销商':'家居采购'}</strong></div><div class="detail">固定跟进账号<strong>${['Emma · 德国','Oliver · 英国','Alice · 美国','Alice · 美国'][selectedChat]}</strong></div><div class="detail">客户意向<strong>批量采购 / 询价</strong></div><div class="detail">下一步<strong>确认报价并转交销售客服</strong></div><button class="primary" style="width:100%" onclick="modal('handoff')">转交客服 →</button><p style="font-size:11px;margin-top:12px">转交记录与实际接待结果分开显示。</p></div></div>`,
agent:()=>title('Agent 自动接待','接入 OpenAI API，自动理解需求、回答问题，并引导客户联系主客服。',`<button class="primary" onclick="showModal('OpenAI 自动接待接入规划','当前为 UI 原型，尚未调用 OpenAI 或 Telegram。','<div class=agent-box>先配置服务端 API 密钥与模型，再指定产品知识和客服主账号。<br>收到客户回复后自动接待；达到引导条件时发送客服联系方式。<br>正式版记录真实发送回执、API 用量和人工接待状态。</div>','知道了','closeModal()')">查看接入规划</button>`)+`<div class="card" style="margin-bottom:22px"><div class="card-head"><h2>OpenAI 接入与客服目标</h2><span class="tag orange">尚未接入 · 配置预览</span></div><div class="steps"><div class="step"><h3>1. API 连接</h3><p>OpenAI Responses API</p><span>正式版在安全后台配置密钥；本页不收集密钥。</span></div><div class="step"><h3>2. 产品知识</h3><p>产品资料 + 接待规则</p><span>根据已确认资料回答，不编造价格或承诺。</span></div><div class="step"><h3>3. 客服主账号</h3><input aria-label="客服主账号" placeholder="@你的客服用户名" style="width:100%;margin-top:5px"><span>可按通讯录分组指定接待目标。</span></div><div class="step"><h3>4. 引导结果</h3><p>待引导 → 已发联系方式</p><span>客户到达与客服已接待单独确认。</span></div></div><p style="font-size:12px;margin-top:16px">自动接待仅处理已授权会话。拒绝联系立即停止；人工接管时自动回复暂停。当前输入仅用于界面预览，不会保存。</p></div><div class="agent-grid"><div class="card"><div class="card-head"><h2>自动接待规则</h2>${badge('自动接待 · 待接入')}</div>${[['何时开始接待','客户回复后，在获得授权的会话中处理消息。'],['可以回答什么','产品规格、产品目录、已确认的配送与售后规则。'],['什么时候引导主客服','客户有采购意向、需要报价，或知识库没有答案时，自动介绍已配置的客服主账号。'],['人工接管后','立即暂停自动回复，直到人工主动交还。']].map(x=>`<div class="setting"><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('')}<label style="display:block;margin-top:20px">回复语气　<select><option>自然、简洁、专业</option><option>友好、热情</option></select></label></div><div><div class="card"><div class="card-head"><h2>产品知识库</h2><button class="link" onclick="modal('knowledge')">＋ 添加</button></div><div class="task"><span>▤</span><div><h3>产品目录 · 2026</h3><p>演示资料 · 24 条产品说明</p></div>${badge('可用')}</div><div class="task"><span>▤</span><div><h3>配送与售后说明</h3><p>演示资料 · 12 条问答</p></div>${badge('可用')}</div></div><div class="card bottom"><h2>先试一下助手</h2><p style="font-size:12px;margin:12px 0">点击查看知识库回答与转人工的两种情况。</p><button onclick="toast('演示回答：可配送至英国，具体运费请客服根据地址确认。')">“你们可以发货到英国吗？”</button><button style="margin-top:10px" onclick="toast('演示判断：价格需要人工确认，已建议转交销售客服。')">“200 件可以给什么折扣？”</button></div></div></div>`};
function contactRows(){return table(['客户 / 公司','分组','跟进状态','负责账号','最近联系','操作'],customers.filter(a=>(filter==='全部'||a.includes(filter))&&a.join(' ').toLowerCase().includes(query.toLowerCase())).map(a=>`<tr><td><div class="person"><div class="avatar">${a[0][0]}</div><div>${a[0]}<small>${a[1]}</small></div></div></td><td>${a[2]}</td><td>${badge(a[3])}</td><td>${a[4]}</td><td>${a[5]}</td><td><button class="link" onclick="openContact('${a[0]}')">查看沟通 →</button></td></tr>`))}function openContact(name){let i=['Daniel Weber','Amelia Brown','Sofia Miller','Olivia Wilson'].indexOf(name);if(i<0){toast('该客户尚无演示会话');return}selectedChat=i;human=false;go('inbox')}function updateRows(){document.getElementById('rows').innerHTML=contactRows()}function send(){let t=document.getElementById('reply');if(!t.value.trim())return toast('请先输入回复内容');let d=document.createElement('div');d.className='bubble me';d.innerHTML=esc(t.value)+'<small>人工 · 模拟发送成功 · 未发送至 Telegram</small>';document.getElementById('messages').append(d);t.value='';d.scrollIntoView({block:'nearest'});toast('模拟发送成功，未产生真实消息')}function closeModal(){document.getElementById('overlay').innerHTML=''}function showModal(title,desc,body,action='保存演示',handler="closeModal();toast('演示操作已完成，未修改真实数据')"){document.getElementById('overlay').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true" aria-label="${title}"><div class="row spread"><h2>${title}</h2><button onclick="closeModal()" aria-label="关闭">×</button></div><p>${desc}</p>${body}<div class="modal-footer"><button onclick="closeModal()">取消</button><button class="primary" onclick="${esc(handler)}">${action}</button></div></div></div>`}function modal(kind){const forms={import:['导入客户','先检查格式与重复号码，再确认分组。原型仅展示流程，不读取文件。','<div class="upload">CSV / Excel 客户名单<br><small>姓名 · 电话号码 · 公司 · 国家</small></div><label>导入到分组<select><option>家居采购</option><option>欧洲经销商</option></select></label>','预览导入结果',"showModal('导入预览','以下是固定演示结果，不是真实文件解析。','<div class=notice>识别 120 条 · 8 条重复 · 2 条格式不正确<br>预计导入 110 位新客户；默认状态为未联系。</div>','完成演示导入')"],task:['新建跟进任务','只对已确认可联系的客户安排任务。此处不会实际发送。','<label>任务名称<input placeholder="例如：欧洲经销商产品介绍"></label><label>客户分组<select><option>欧洲经销商 · 已确认可联系</option><option>家居采购 · 已确认可联系</option></select></label><label>跟进账号<select><option>按客户的固定负责账号</option></select></label><label>联系内容<textarea rows="3" placeholder="输入与客户需求相关的介绍…"></textarea></label><label>回复后的处理<select><option>停止后续跟进，交给 Agent 或人工接待</option></select></label>','预览任务',"showModal('确认任务预览','仅演示，不会建立真实发送任务。','<div class=agent-box>客户分组：欧洲经销商<br>账号：按固定归属分配<br>仅运行可用账号，异常账号暂停<br>客户回复后停止后续自动跟进</div>','保存演示任务',\"closeModal();go('tasks');toast('演示任务已展示，未真实发送')\")"],account:['添加账号','正式版本会验证登录资料与会话授权；此原型不接收任何凭据。','<label>登录方式<select><option>导入 Session</option><option>导入 Tdata</option><option>手机号登录</option></select></label><div class="upload" style="margin-top:18px">登录材料上传位置 · 仅示意</div><label>选择网络<select><option>美国 · 芝加哥 01</option><option>德国 · 法兰克福 01</option></select></label><label>账号名称<input placeholder="例如：美国客户接待 01"></label>','查看验证流程',"showModal('账号验证流程','正式版本逐项提供真实结果。','<div class=agent-box>1. 检查文件格式与身份<br>2. 检查绑定网络<br>3. 验证 Telegram 授权<br>4. 同步会话并开始接收消息<br><br>导入完成不代表登录成功。</div>','知道了','closeModal()')"],network:['添加网络','正式版本加密保存代理凭据。原型请勿填写真实密码。','<label>名称<input placeholder="例如：美国 · 芝加哥 01"></label><label>协议<select><option>SOCKS5</option><option>HTTP</option></select></label><label>地址与端口<input placeholder="proxy.example.com:1080"></label><label>备注<input placeholder="服务商、地区或到期信息"></label>'],group:['客户分组','用地区、行业或业务阶段整理客户。','<label>分组名称<input placeholder="例如：欧洲经销商"></label><label>说明<textarea placeholder="这个分组用来管理哪些客户？"></textarea></label>'],handoff:['转交客服','保留沟通摘要，减少客户重复介绍需求。','<label>接待客服<select><option>销售客服 · 小林</option><option>售前客服 · 小陈</option></select></label><label>客户需求摘要<textarea rows="3">客户咨询 200 件采购价格，需要确认报价与配送安排。</textarea></label><div class="notice" style="margin-top:15px">发出客服联系方式不等于客户已经到达。后续需记录实际接待结果。</div>','模拟转交',"closeModal();toast('已模拟转交，状态为等待客服接待')"],knowledge:['添加产品知识','优先使用自己的产品资料，不导入客户历史聊天作为训练材料。','<label>资料标题<input placeholder="例如：产品配送说明"></label><label>知识内容<textarea rows="5" placeholder="填写经过确认的产品说明…"></textarea></label>']};showModal(...forms[kind])}function accountDetail(name,state){showModal(name,'状态、原因与下一步操作集中展示。',`<div class="agent-box">当前状态：${badge(state)}<br><br>${state==='可用'?'演示验证：授权有效、网络正常、正在接收消息。<br>具体会话能否发送，仍取决于会话权限。':state==='等待恢复'?'原因：绑定网络暂时不可用。<br>下一步：检查网络，恢复后重新验证连接。':'原因：会话授权已失效。<br>下一步：重新完成登录验证。'}</div>`,'知道了','closeModal()')}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});let initial=location.hash.slice(1);if(routes.some(r=>r[0]===initial))page=initial;window.addEventListener('hashchange',()=>{let p=location.hash.slice(1);if(routes.some(r=>r[0]===p)&&p!==page){page=p;render()}});render();
</script></body></html>
